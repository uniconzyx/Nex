<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 268" width="200" height="268" role="img" aria-label="冰蓝试炼塔">
  <title>冰蓝试炼塔</title>
  <defs>
    <linearGradient id="tt-body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#BEE6FF"/>
      <stop offset="0.42" stop-color="#6FC0F0"/>
      <stop offset="1" stop-color="#3A78C4"/>
    </linearGradient>
    <linearGradient id="tt-body-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E9BD6"/>
      <stop offset="1" stop-color="#2F63A8"/>
    </linearGradient>
    <linearGradient id="tt-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4F5FF"/>
      <stop offset="1" stop-color="#7FCBFF"/>
    </linearGradient>
    <linearGradient id="tt-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BD6F5"/>
      <stop offset="1" stop-color="#3F82CE"/>
    </linearGradient>
    <linearGradient id="tt-shard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FAFF"/>
      <stop offset="1" stop-color="#7FC6F2"/>
    </linearGradient>
    <linearGradient id="tt-spire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8FD3FF"/>
    </linearGradient>
    <radialGradient id="tt-aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C5E4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C5E4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tt-floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A6DEFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#A6DEFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tt-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tt-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <!-- 背景光晕与地面 -->
  <ellipse cx="100" cy="150" rx="94" ry="116" fill="url(#tt-aura)" opacity="0.65"/>
  <ellipse cx="100" cy="250" rx="82" ry="13" fill="url(#tt-floor)"/>

  <!-- 背后的漂浮碎片 -->
  <g opacity="0.6" filter="url(#tt-soft)">
    <polygon points="24,58 39,66 39,82 24,90 9,82 9,66" fill="url(#tt-shard)"/>
    <polygon points="178,42 191,49 191,63 178,70 165,63 165,49" fill="url(#tt-shard)"/>
    <polygon points="184,120 195,127 195,140 184,147 173,140 173,127" fill="url(#tt-shard)"/>
    <polygon points="18,136 29,142 29,155 18,161 7,155 7,142" fill="url(#tt-shard)"/>
  </g>
  <!-- 两侧小尖塔（纵深） -->
  <g opacity="0.75">
    <polygon points="46,150 60,158 60,176 46,184 32,176 32,158" fill="url(#tt-body-dark)"/>
    <polygon points="46,142 56,147 56,157 46,162 36,157 36,147" fill="url(#tt-roof)"/>
    <polygon points="152,158 164,165 164,180 152,187 140,180 140,165" fill="url(#tt-body-dark)"/>
    <polygon points="152,151 161,155 161,164 152,168 143,164 143,155" fill="url(#tt-roof)"/>
  </g>

  <!-- 塔基：上下两层台阶 -->
  <polygon points="54,204 146,204 176,222 146,240 54,240 24,222" fill="url(#tt-base)" filter="url(#tt-glow)"/>
  <polygon points="54,204 146,204 161,213 39,213" fill="#DFF2FF" opacity="0.5"/>
  <polygon points="62,240 138,240 152,249 48,249" fill="#2F63A8" opacity="0.55"/>

  <!-- 塔身 -->
  <polygon points="100,56 146,84 146,142 100,170 54,142 54,84" fill="url(#tt-body)" filter="url(#tt-glow)"/>
  <!-- 左半受光 / 右半背光，做出体积 -->
  <polygon points="100,56 146,84 146,142 100,170" fill="url(#tt-body-dark)" opacity="0.55"/>
  <polygon points="100,56 146,84 146,96 100,68 54,96 54,84" fill="#FFFFFF" opacity="0.32"/>
  <!-- 腰线 -->
  <polygon points="54,118 146,118 146,124 54,124" fill="#FFFFFF" opacity="0.18"/>

  <!-- 塔窗：两枚小六边形 -->
  <polygon points="78,84 87,89 87,99 78,104 69,99 69,89" fill="#2B3E50" opacity="0.55"/>
  <polygon points="122,84 131,89 131,99 122,104 113,99 113,89" fill="#2B3E50" opacity="0.55"/>

  <!-- 代码符号 -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.96">
    <polyline points="86,110 74,120 86,130"/>
    <polyline points="114,110 126,120 114,130"/>
    <line x1="103" y1="106" x2="97" y2="134"/>
  </g>

  <!-- 塔门 -->
  <polygon points="100,132 116,141 116,161 100,170 84,161 84,141" fill="#22323F" opacity="0.92"/>
  <polygon points="100,137 111,143 111,158 100,164 89,158 89,143" fill="#16222C" opacity="0.7"/>
  <circle cx="107" cy="151" r="1.8" fill="#8FD3FF" opacity="0.9"/>

  <!-- 塔顶 -->
  <polygon points="72,26 128,26 152,43 128,60 72,60 48,43" fill="url(#tt-roof)" filter="url(#tt-glow)"/>
  <polygon points="72,26 128,26 140,33 60,33" fill="#FFFFFF" opacity="0.45"/>

  <!-- 尖顶水晶 -->
  <polygon points="100,2 112,16 100,30 88,16" fill="url(#tt-spire)" filter="url(#tt-glow)"/>
  <circle cx="100" cy="6" r="2.6" fill="#FFFFFF" opacity="0.95"/>

  <!-- 小旗 -->
  <path d="M100 30 L100 12" stroke="#5DB4E5" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 12 L114 17 L100 22 Z" fill="#8B5CF6" opacity="0.85"/>

  <!-- 环绕光圈 -->
  <ellipse cx="100" cy="122" rx="78" ry="98" fill="none" stroke="#9BDBFF" stroke-opacity="0.32" stroke-width="1.2"/>
  <!-- 零星星光 -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="42" cy="104" r="1.6"/>
    <circle cx="162" cy="96" r="1.4"/>
    <circle cx="150" cy="52" r="1.2"/>
    <circle cx="58" cy="40" r="1.3"/>
  </g>
</svg>
