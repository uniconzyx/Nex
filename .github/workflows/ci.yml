name: CI (后端对齐验收 + 前端冒烟)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ===================== 后端双端对齐验收（真 Postgres） =====================
  backend-parity:
    name: Nex 后端 PG 端到端验收
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cppmind
          POSTGRES_PASSWORD: cppmind
          POSTGRES_DB: cppmind
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U cppmind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
        working-directory: server

      - name: Run Nex backend parity (真 PG)
        working-directory: server
        env:
          DATABASE_URL: "postgresql://cppmind:cppmind@localhost:5432/cppmind"
        run: python scripts/verify_nex_parity_pg.py

  # ===================== 前端构建 + dev server 冒烟 =====================
  frontend-smoke:
    name: Frontend 构建 + dev server 冒烟
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (tsc --noEmit + vite build)
        run: npm run build

      - name: Dev server 冒烟 (vite dev @ :1420)
        run: |
          nohup npm run dev > /tmp/vite-dev.log 2>&1 &
          VITE_PID=$!
          # 轮询直到 dev server 返回 200，最多 ~60s
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1420 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- dev server 响应检查 ---"
          BODY=$(curl -s http://localhost:1420)
          if [ -z "$BODY" ]; then
            echo "dev server 未返回任何内容，冒烟失败"; cat /tmp/vite-dev.log; kill $VITE_PID 2>/dev/null; exit 1
          fi
          echo "$BODY" | grep -q '<div id="app">' || echo "提示：未检测到 <div id=\"app\">，请确认入口挂载点"
          echo "dev server 冒烟通过 (HTTP 200, $(echo "$BODY" | wc -c) bytes)"
          kill $VITE_PID 2>/dev/null

  # ===================== 图标与封装资产防回归（源级） =====================
  # EXE / APK 是 .gitignore 的本机产物，CI 上没有二进制，所以这一层校验的是
  # 「能进版本库的那一半」：图标源文件、生成器幂等、build.rs 依赖声明、
  # prepare.py 重编模板。产物里的图标色差 / so 非 0 字节由本机
  # deploy/package/verify_icons.py 的 10 项断言守门。
  package-assets:
    name: 图标与封装资产防回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: 图标生成器幂等 + 构建链静态自检
        run: python deploy/package/verify_icon_sources.py

      - name: 原生包二进制校验（产物存在时）
        run: |
          if [ -f release/nex-shell/Nex-Desktop-1.0.exe ] && [ -f release/nex-shell/Nex-Mobile-1.0-arm64.apk ]; then
            python deploy/package/verify_icons.py
          else
            echo "EXE/APK 为 .gitignore 的本机产物，CI 无二进制；源级 10/10 已覆盖。"
            echo "EXE 图标色差 / APK 启动图标逐像素 / arm64 so 非 0 字节由本机 verify_icons.py 守门。"
          fi

  # ===================== 内容健康度 + 前端数据生成物同步 =====================
  # 2026-11-07 收口：历史上 13 章 exercises.json 欠账（meta.note 题数滞后、
  # 参考代码语法错误）长期无人发现；更严重的是加题后漏跑生成器，入库产物一度
  # 比 content/ 少 25 道题（exercises.ts）、discrete-math.ts 只含 1/3 章。
  # 检查器只读 content/，看不见产物滞后，所以这一层「源健康 + 生成物同步」两者
  # 都守；2026-11-08 起把 chapterContent.ts / viz/*.ts 也一并纳入幂等比对。
  content-health:
    name: 内容健康度 + 前端数据生成物同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 题集健康度（字段 / 链接 / 参考代码语法 / meta 自洽）
        run: python server/scripts/verify_exercises.py

      - name: 前端数据生成物与 content/ 同步（防漏跑生成器）
        run: |
          python server/scripts/gen_exercise_bundle.py
          python scripts/gen_chapter_content.py
          python scripts/gen_concept_viz.py
          # git diff --exit-code 只看 tracked 文件的修改，抓不到「新增学科生成了
          # 新 .ts 却没入库」这种 untracked 情况；用 status --porcelain 同时覆盖
          # modified / untracked / deleted。viz/data.js 是 .gitignore 的本机产物，
          # 不在下面限定的路径里，重跑不会造成假 diff。
          CHANGED=$(git status --porcelain -- \
            frontend/src/data/exercises.ts \
            frontend/src/data/clangUnits.ts \
            frontend/src/data/chapterContent.ts \
            frontend/src/data/viz/)
          if [ -n "$CHANGED" ]; then
            echo "::error::前端数据生成物与 content/ 不同步，请重跑上面三个生成器并把产物入库"
            echo "$CHANGED"
            git diff -- frontend/src/data/ | head -80
            exit 1
          fi
          echo "三个生成器幂等：exercises.ts / clangUnits.ts / chapterContent.ts / viz/*.ts 均已同步"
